<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Compatibility evidence levels</title>
  <desc id="desc">Evidence levels from unsupported to production-tested. At the matrix's evidence review date: Android and iOS are unsupported, macOS is build-supported, Linux is smoke-tested, Windows is editor-tested. No platform is positioned at sample-project-tested or production-tested.</desc>
  <g fill="none" stroke="#777" stroke-width="1">
    <path d="M10 18V336" />
    <path d="M10 18H18 M10 76H18 M10 134H18 M10 192H18 M10 250H18 M10 328H18" />
  </g>
  <g font-family="Geist, system-ui, sans-serif" font-size="16" fill="#202020">
    <text x="26" y="24">unsupported</text>
    <text x="26" y="82">build-supported</text>
    <text x="26" y="140">smoke-tested</text>
    <text x="26" y="198">editor-tested</text>
    <text x="26" y="256">sample-project-<tspan x="26" dy="20">tested</tspan></text>
    <text x="26" y="334">production-tested</text>
  </g>
  <g font-family="Geist, system-ui, sans-serif" font-size="15" fill="#626262">
    <text x="26" y="45">Android · iOS</text>
    <text x="26" y="103">macOS</text>
    <text x="26" y="161">Linux</text>
    <text x="26" y="219">Windows</text>
    <text x="26" y="297">No platform claim</text>
    <text x="26" y="355">No platform claim</text>
  </g>
</svg>
