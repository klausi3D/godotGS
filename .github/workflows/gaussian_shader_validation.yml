name: Gaussian Shader Validation

on:
  pull_request:
    branches: [master]
    paths:
      - "modules/gaussian_splatting/shaders/**"
      - "modules/gaussian_splatting/compute/**"
      - "modules/gaussian_splatting/renderer/gpu_sorter.cpp"
      - "modules/gaussian_splatting/renderer/gpu_sorter.h"
      - "modules/gaussian_splatting/renderer/gpu_sorting_config.cpp"
      - "modules/gaussian_splatting/renderer/gpu_sorting_constants.h"
      - "modules/gaussian_splatting/renderer/sorting_contract.h"
      - "modules/gaussian_splatting/interfaces/gpu_sorting_pipeline.cpp"
      - "modules/gaussian_splatting/renderer/pipeline_io_contracts.h"
      - "modules/gaussian_splatting/renderer/tile_render_stages.h"
      - "modules/gaussian_splatting/renderer/tile_render_types.h"
      - "modules/gaussian_splatting/renderer/tile_renderer.cpp"
      - "modules/gaussian_splatting/interfaces/gpu_culler.cpp"
      - ".github/workflows/gaussian_shader_validation.yml"
  # CI diet (maintainer approval 2026-11-07): no push trigger, so a merge costs no
  # self-hosted runner time. The PR run above validates the same shaders; the
  # nightly below re-validates master HEAD without a path filter.
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: gaussian-shader-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  shader-validation:
    name: Runtime Shader Matrix + Contracts
    # Never run self-hosted code on untrusted fork PR code. Same-repo branches
    # (maintainer PRs), schedule, and workflow_dispatch still run; fork PRs are skipped.
    # Mirrors the guard used in baseline_qa.yml and protects the
    # persistent runner from arbitrary checked-out repo code (compile_shaders.py and
    # anything under modules/.../shaders). (merge_group is maintainer-gated — see the
    # runner trust boundary in .github/workflows/README.md.)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # The only self-hosted runner is the Linux RTX 3080 box. No `gpu` label: the
    # shader matrix is compiled on the CPU (glslc/glslangValidator), so this job
    # is not part of the GPU pool that the contention/environment preflights guard.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        shell: bash

    steps:
      - name: Configure Git safe.directory for self-hosted workspace
        run: git config --global --get-all safe.directory | grep -qxF '*' || git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
          set-safe-directory: false

      - name: Verify local Python availability
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 executable was not found on the self-hosted runner."
            exit 1
          fi
          python3 --version

      # This runner has no sudo, so no job installs system packages: a missing
      # compiler fails closed here and names the package to install.
      - name: Verify shader compiler availability
        run: |
          have_glslc=0
          have_validator=0
          command -v glslc >/dev/null 2>&1 && have_glslc=1
          command -v glslangValidator >/dev/null 2>&1 && have_validator=1
          if [ "$have_glslc" = 0 ] && [ "$have_validator" = 0 ]; then
            echo "::error::No shader compiler found on the self-hosted runner. Install glslc or glslangValidator (package glslang-tools) and retry."
            exit 1
          fi
          if [ "$have_glslc" = 1 ]; then
            glslc --version
          fi
          if [ "$have_validator" = 1 ]; then
            glslangValidator --version
          fi

      - name: Run shader matrix validation
        run: |
          out_dir="$RUNNER_TEMP/gaussian_shader_validation"
          mkdir -p "$out_dir"
          script_path="repo/modules/gaussian_splatting/shaders/compile_shaders.py"
          if [ ! -f "$script_path" ]; then
            echo "::error::compile_shaders.py not found in expected locations: $script_path"
            exit 1
          fi
          python3 "$script_path" \
            --output-dir "$out_dir/spv" \
            --summary-json "$out_dir/summary.json"

      - name: Print validation summary
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/gaussian_shader_validation
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["OUT_DIR"]) / "summary.json"
          if not summary_path.exists():
              print("summary.json not found; skipping summary output because an earlier step failed.")
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          compile_results = summary.get("compile_results", [])
          failures = [r for r in compile_results if not r.get("ok")]
          print(f"checks_success={summary.get('checks_success')}")
          print(f"compile_success={summary.get('compile_success')}")
          print(f"compile_attempts={len(compile_results)}")
          print(f"compile_failures={len(failures)}")
          print(f"issues={','.join(summary.get('issues', []))}")
          PY

      - name: Upload shader validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-shader-validation
          path: |
            ${{ runner.temp }}/gaussian_shader_validation/summary.json
            ${{ runner.temp }}/gaussian_shader_validation/spv
          if-no-files-found: warn
