name: zz-probe2
on:
  push:
    branches: [chore/ci-linux-gpu-runner]
    paths: ['.github/workflows/zz_probe2.yml']
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build (cached)
        shell: bash
        run: |
          set -e
          bash tests/ci/linux_gpu_runner.sh venv
          export PATH="$RUNNER_TEMP/gs-ci-venv/bin:$PATH"
          python -m SCons platform=linuxbsd target=editor dev_build=yes tests=yes module_gaussian_splatting_enabled=yes gs_native_arch=no cache_path=/opt/actions-runner/godotgs-scons-cache cache_limit=50 -j16 2>&1 | tail -3
      - name: load + observe
        shell: bash
        run: |
          set +e
          export PATH="$RUNNER_TEMP/gs-ci-venv/bin:$PATH"
          B="$PWD/bin/godot.linuxbsd.editor.dev.x86_64"
          id; ps -o pid,user,args -C Xorg
          (GS_CI_GPU_REQUIRED=1 python tests/ci/run_baseline_qa.py --categories qa --qa-require-capture --godot "$B" > /tmp/qa_load.log 2>&1 &)
          for t in 25 50 75; do
            sleep 25
            echo "=== t=$t"
            echo "--- pmon"; nvidia-smi pmon -c 1 -s u 2>&1
            echo "--- compute-apps"; nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv 2>&1
            echo "--- accounted"; nvidia-smi --query-accounted-apps=pid,gpu_utilization,mem_utilization,max_memory_usage --format=csv 2>&1 | head -5
            echo "--- nvidia-smi table"; nvidia-smi 2>&1 | sed -n '/Processes/,$p'
            echo "--- fds on /dev/nvidia*"
            for p in /proc/[0-9]*; do
              if ls -l $p/fd 2>/dev/null | grep -q /dev/nvidia; then echo "$(basename $p) $(stat -c %U $p) $(readlink $p/exe 2>/dev/null) :: $(tr '\0' ' ' < $p/cmdline 2>/dev/null | cut -c1-120)"; fi
            done
            echo "--- godot procs"; ps -eo pid,user,comm | grep -i -E "godot|Xorg"
          done
          echo "=== Xorg display identification"
          for p in $(pgrep -x Xorg); do echo "Xorg pid $p user $(stat -c %U /proc/$p) cmd: $(tr '\0' ' ' < /proc/$p/cmdline)"; done
          ls -la /tmp/.X11-unix/ 2>&1
          sleep 60
          tail -5 /tmp/qa_load.log
