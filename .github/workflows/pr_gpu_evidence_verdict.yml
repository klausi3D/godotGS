name: Trusted PR GPU Evidence Verdict

# pull_request_target is used ONLY to read GitHub metadata and artifacts.
# Checkout is the immutable BASE, never PR/fork code. No self-hosted jobs,
# repository writes, package installation, PR execution, or privileged checkout.
# The sole write permission publishes the verdict on the proposed commit SHA.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: trusted-gpu-verdict-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  trusted-gpu-controller:
    name: Trusted GPU Evidence Controller
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Checkout trusted immutable base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact-head evidence without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/agentic/watch_pr_gpu_evidence.py
