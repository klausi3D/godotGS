name: Trusted PR GPU Evidence Verdict
# Owner activation is separate: exact master-only credential environment,
# dedicated publisher App, read-only enforcement proof credential and strict.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_run:
    workflows: [Gaussian Production Gates]
    types: [in_progress, completed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: trusted-gpu-verdict-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  trusted-gpu-controller:
    name: Trusted GPU Evidence Controller
    if: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') }}
    environment: trusted-gpu-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Resolve trusted event metadata
        id: event
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const repository = (await github.rest.repos.get({owner, repo})).data;
            if (repository.default_branch !== 'master') throw new Error('Unsupported default branch');
            let pull = context.payload.pull_request;
            const source = context.payload.workflow_run;
            if (source) {
              if (source.name !== 'Gaussian Production Gates' || source.event !== 'pull_request') throw new Error('Unsupported producer');
              const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,
                {owner, repo, commit_sha: source.head_sha, per_page: 100});
              const matching = associated.filter(p => p.state === 'open' && p.head.sha === source.head_sha && p.base.ref === 'master');
              if (!matching.length) throw new Error('No supported current PR for source commit');
              matching.sort((a, b) => a.number - b.number);
              pull = (await github.rest.pulls.get({owner, repo, pull_number: matching[0].number})).data;
            }
            if (source && pull.head.sha !== source.head_sha) throw new Error('Source head moved');
            if (!pull || pull.base.ref !== 'master' || !/^[0-9a-f]{40}$/.test(pull.head.sha)) throw new Error('Unsupported PR');
            const branch = (await github.rest.repos.getBranch({owner, repo, branch: 'master'})).data;
            const trusted = branch.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(trusted)) throw new Error('Missing trusted default SHA');
            const event = {pull_request: pull, trusted_base_sha: trusted};
            if (source) event.source_run_id = source.id;
            const path = process.env.RUNNER_TEMP + '/gpu-evidence-event.json';
            fs.writeFileSync(path, JSON.stringify(event));
            core.setOutput('path', path);
            core.setOutput('base', trusted);
      - name: Checkout trusted immutable default only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.event.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Create dedicated publisher token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GPU_CODE_EVIDENCE_APP_ID }}
          private-key: ${{ secrets.GPU_CODE_EVIDENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Verify exact-commit evidence without executing PR code
        timeout-minutes: 150
        env:
          GITHUB_EVENT_PATH: ${{ steps.event.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          GS_PUBLISH_TOKEN: ${{ steps.publisher.outputs.token }}
          GS_PUBLISH_APP_ID: ${{ vars.GPU_CODE_EVIDENCE_APP_ID }}
          GS_PROTECTION_TOKEN: ${{ secrets.GPU_CODE_EVIDENCE_PROTECTION_READ_TOKEN }}
          GS_CODE_EVIDENCE_BOOTSTRAP: ${{ vars.GPU_CODE_EVIDENCE_BOOTSTRAP }}
        run: python scripts/agentic/watch_pr_gpu_evidence.py

  # Separate job can recover a controller timeout. Whole-workflow cancellation,
  # service/API outage and read-to-write races remain bounded failure limits.
  trusted-gpu-cleanup:
    name: Trusted GPU Evidence Cleanup
    needs: trusted-gpu-controller
    if: ${{ always() && (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Gaussian Production Gates' && github.event.workflow_run.event == 'pull_request')) }}
    environment: trusted-gpu-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve independent immutable event binding
        id: event
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const head = context.payload.pull_request?.head.sha || context.payload.workflow_run?.head_sha;
            if (!/^[0-9a-f]{40}$/.test(head || '')) throw new Error('Missing immutable event commit');
            const trusted = (await github.rest.repos.getBranch({owner, repo, branch: 'master'})).data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(trusted)) throw new Error('Missing trusted default SHA');
            const event = {pull_request: {head: {sha: head}}, trusted_base_sha: trusted};
            const path = process.env.RUNNER_TEMP + '/gpu-evidence-cleanup.json';
            fs.writeFileSync(path, JSON.stringify(event));
            core.setOutput('path', path);
            core.setOutput('base', trusted);
      - name: Checkout trusted immutable default only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.event.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Create dedicated publisher token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GPU_CODE_EVIDENCE_APP_ID }}
          private-key: ${{ secrets.GPU_CODE_EVIDENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Publish failure if the controller aborted
        env:
          GITHUB_EVENT_PATH: ${{ steps.event.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          GS_PUBLISH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: python scripts/agentic/watch_pr_gpu_evidence.py --cleanup
