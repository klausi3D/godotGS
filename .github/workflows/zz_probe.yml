name: zz-probe
on:
  push:
    branches: [chore/ci-linux-gpu-runner]
    paths: ['.github/workflows/zz_probe.yml']
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gpu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: probe
        shell: bash
        run: |
          set +e
          python3 tests/ci/preflight_runner_gpu_environment.py; echo "preflight rc=$?"
          python3 tests/ci/runner_gpu_contention.py preflight; echo "contention rc=$?"
          vulkaninfo --summary > /tmp/vi.txt 2>&1; echo "vulkaninfo rc=$?"; grep -E "deviceName|deviceType|driverName" /tmp/vi.txt
          VK_LOADER_DEBUG=layer,info vulkaninfo --summary 2>&1 | grep -i "layer" | head -20
          nvidia-smi pmon -c 1 -s u; echo "pmon rc=$?"
          nvidia-smi --query-gpu=utilization.gpu,memory.used --format=csv
          which xvfb-run; ls /usr/lib/x86_64-linux-gnu | grep -E "libXext|libXrender|libXfixes|libxcb\.|libwayland|libdecor|libxkbcommon|libfreetype|libfontconfig"
