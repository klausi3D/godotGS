name: zz-probe
on:
  push:
    branches: [chore/ci-linux-gpu-runner]
    paths: ['.github/workflows/zz_probe.yml']
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gpu]
    timeout-minutes: 10
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          pkg-config --exists zlib && echo zlib_ok || echo zlib_MISSING
          ls /var/lib/apt/lists | head -3
          D=$RUNNER_TEMP/dl; mkdir -p $D; cd $D
          apt-get download glslang-tools 2>&1 | tail -3
          ls -la
          dpkg-deb -x glslang-tools*.deb x && ls x/usr/bin && ldd x/usr/bin/glslangValidator | head
          apt-cache policy glslang-tools | head -4
          ls /usr/lib/x86_64-linux-gnu | grep -E "libX11|libXcursor|libXi\.|libXrandr|libXinerama|libxkbcommon|libvulkan|libGL|libasound|libpulse|libudev|libdbus|libfontconfig" 
          python3 -m venv $RUNNER_TEMP/v && $RUNNER_TEMP/v/bin/python -c "print('venv works')"
          ls ~/ -la | head; echo HOME=$HOME; ps -eo pid,comm | grep -i -E "runner|Xorg|Xvfb|godot" | head
          cat /proc/sys/kernel/yama/ptrace_scope 2>&1; ls /dev/dri /dev/nvidia* 2>&1 | head
