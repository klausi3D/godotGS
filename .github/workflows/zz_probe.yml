name: zz-probe
on:
  push:
    branches: [chore/ci-linux-gpu-runner]
    paths: ['.github/workflows/zz_probe.yml']
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gpu]
    timeout-minutes: 10
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          env | grep -E "^(VK_|__GLX)"
          VK_LOADER_DEBUG=layer,info timeout 60 vulkaninfo --summary > /tmp/vi.txt 2>&1
          grep -iE "insert|elevated|will be ignored|disable" /tmp/vi.txt | head -30
          echo ---- ; NODEVICE_SELECT=1 VK_LOADER_DEBUG=layer,info timeout 60 vulkaninfo --summary 2>&1 | grep -iE "insert|elevated" | head
          echo ---- ; VK_LOADER_DEBUG=all timeout 60 vulkaninfo --summary 2>&1 | grep -iE "device_select|optimus|NV_present" | head -10
