name: zz-probe
on:
  push:
    branches: [chore/ci-linux-gpu-runner]
    paths: ['.github/workflows/zz_probe.yml']
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gpu]
    timeout-minutes: 10
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          env | grep -E "^(DISPLAY|VK_|__GLX|XDG|HOME|PATH)=" 
          VK_LOADER_DEBUG=layer,info timeout 60 vulkaninfo --summary > /tmp/vi.txt 2>&1; echo "rc=$?"
          grep -iE "layer|loader" /tmp/vi.txt | head -25
          grep -E "deviceName|deviceType|driverName" /tmp/vi.txt
          timeout 20 nvidia-smi pmon -c 1 -s u; echo "pmon rc=$?"
          command -v uv python3.11 pwsh; uv python find 3.11 2>&1 | head -2
          ls /usr/lib/x86_64-linux-gnu | grep -cE "libXext|libxkbcommon"
          for p in x11 xcursor xinerama xi xrandr gl glu alsa libpulse libudev vulkan; do pkg-config --exists $p && echo "have $p" || echo "MISSING $p"; done
          command -v scons glslangValidator glslc
          xdpyinfo -display :0 2>&1 | head -5
