name: Gaussian Production Gates

# Weekly open-world proof evidence only (CI diet, maintainer approval 2026-11-07).
#
# This workflow used to run on every PR, merge-queue entry and master push:
#   * `guards` (the full --guard-only phase on the self-hosted runner) was an exact
#     duplicate of the required agentic-pr-gate's last step. Removed; the guard
#     phase runs once per PR there and in full nightly (baseline_qa.yml cpu-tests).
#   * `gpu-evidence-requirement` + `module-validation` (pipeline smoke, module
#     doctest lanes, headless-ci runtime, streaming-gpu-ci, production evidence and
#     readiness enforcement) moved into baseline_qa.yml: the CPU-only lanes to its
#     hosted `cpu-tests` job, the GPU lanes to its single `gpu-tests` job, which
#     builds once instead of downloading a second build's artifact.
# What remains is the non-blocking open-world proof surface, weekly and on demand.

on:
  workflow_dispatch:
    inputs:
      run_openworld_proof_dev:
        description: "Run non-blocking openworld-proof-dev benchmark evidence surface"
        required: false
        default: false
        type: boolean
      run_openworld_proof_weekly:
        description: "Run non-blocking openworld-proof-weekly benchmark evidence surface"
        required: false
        default: false
        type: boolean
  schedule:
    # Monday 03:30 UTC. The other self-hosted nightlies (baseline_qa.yml 00:30,
    # release_builds.yml 02:30, release_ci_runtime.yml 06:00) are staggered
    # around it; see .github/workflows/README.md.
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: gaussian-production-gates-${{ github.ref }}
  # Scheduled evidence is never cut short; a second run waits.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Compiles the tests=yes editor for openworld-proof-evidence on a runner that
  # does NOT need the `gpu` label, so a CPU-only runner can take this job. The
  # binary travels as an artifact pinned to github.sha: `stage-binary` refuses a
  # checkout that is not github.sha and records commit, run id and sha256;
  # `install-binary` in the GPU job refuses anything that does not match its own
  # github.sha, run id and checkout (tests/ci/linux_gpu_runner.sh).
  build-linux-editor:
    name: Build Linux Editor for GPU Gates (Self-Hosted CPU)
    # The fork guard leads the conjunction like every self-hosted job's, although
    # neither trigger of this workflow can carry fork code.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run_openworld_proof_dev == true || inputs.run_openworld_proof_weekly == true))) }}
    # No `gpu` label: this job renders nothing, so it is not part of the GPU pool
    # that the contention/environment preflights guard.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: repo
        shell: bash
    steps:
      - name: Configure Git safe.directory for self-hosted workspace
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --get-all safe.directory | grep -qxF '*' || git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
          submodules: recursive
          set-safe-directory: false

      - name: Verify Python on runner
        run: |
          python3 --version

      # This runner has no sudo, so no job installs system packages.
      # `--build-only` skips the Vulkan-device and DISPLAY checks: nothing here
      # renders.
      - name: Check Linux runner build toolchain
        run: bash tests/ci/linux_gpu_runner.sh check-tools --build-only

      # GAP-403: per-job venv from the hash-locked file, never the runner's
      # global interpreter.
      - name: Install SCons
        run: bash tests/ci/linux_gpu_runner.sh venv

      # -j16, not nproc (32): the box has 24 GB of RAM.
      - name: Build Godot editor with tests
        run: |
          python -m SCons platform=linuxbsd target=editor dev_build=yes tests=yes gs_native_arch=no cache_path=/opt/actions-runner/godotgs-scons-cache cache_limit=50 -j16

      - name: Resolve Godot binary
        id: godot_bin
        run: |
          resolved=""
          for candidate in \
            bin/godot.linuxbsd.editor.dev.x86_64 \
            bin/godot.linuxbsd.editor.x86_64; do
            if [ -x "$candidate" ]; then
              resolved="$(realpath "$candidate")"
              break
            fi
          done
          if [ -z "$resolved" ]; then
            echo "::error::Could not find built Godot binary in expected bin/ paths."
            ls -la bin || true
            exit 1
          fi
          echo "Resolved Godot binary: $resolved"
          echo "path=$resolved" >> "$GITHUB_OUTPUT"

      - name: Stage binary with commit provenance
        run: bash tests/ci/linux_gpu_runner.sh stage-binary "${{ steps.godot_bin.outputs.path }}" "$RUNNER_TEMP/godot-build"

      - name: Upload binary for the GPU jobs
        uses: actions/upload-artifact@v4
        with:
          name: godot-linuxbsd-editor-tests-${{ github.sha }}
          path: ${{ runner.temp }}/godot-build/
          if-no-files-found: error
          retention-days: 7

  openworld-proof-evidence:
    name: Open-World Proof Evidence (non-blocking)
    # Requires the build explicitly; `!cancelled()` keeps a cancelled run from
    # starting it.
    if: ${{ !cancelled() && needs.build-linux-editor.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.run_openworld_proof_dev == true || inputs.run_openworld_proof_weekly == true))) }}
    continue-on-error: true
    runs-on: [self-hosted, Linux, X64, gpu]
    # Tests the binary build-linux-editor compiled for this exact commit. That
    # job does NOT carry continue-on-error, so a compile failure on these events
    # now shows as a red run instead of being absorbed by this evidence job.
    needs: build-linux-editor
    timeout-minutes: 120
    # #875 -- see the "Self-hosted GPU runner environment" section of
    # .github/workflows/README.md.
    env:
      # Loader-side filter. Honoured only in a NON-elevated process; the Linux
      # runner is not elevated, so on Linux this alone strips implicit layers.
      VK_LOADER_LAYERS_DISABLE: '~implicit~'
      # VK_LOADER_LAYERS_ENABLE is deliberately NOT set on Linux: the NVIDIA Linux
      # driver's layers are not implicit, and force-enabling them would put layers
      # into the chain that no run outside CI has (measured: the preflight failed).
      # Each layer's own opt-out, declared in its own manifest under
      # `disable_environment`. Mirrored in
      # tests/ci/preflight_runner_gpu_environment.py LAYER_DISABLE_ENV.
      # VK_LAYER_OBS_HOOK
      DISABLE_VULKAN_OBS_CAPTURE: '1'
      # VK_LAYER_OW_OBS_HOOK
      DISABLE_VULKAN_OW_OBS_CAPTURE: '1'
      # VK_LAYER_OW_OVERLAY
      DISABLE_VULKAN_OW_OVERLAY_LAYER: '1'
      # VK_LAYER_MESA_device_select (Linux; the ICD is pinned to NVIDIA by the runner .env)
      NODEVICE_SELECT: '1'
    defaults:
      run:
        working-directory: repo
        shell: bash
    steps:
      - name: Configure Git safe.directory for self-hosted workspace
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --get-all safe.directory | grep -qxF '*' || git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0
          submodules: recursive
          set-safe-directory: false

      - name: Verify Python on runner
        run: |
          python3 --version

      # This runner has no sudo, so no job installs system packages. This step
      # fails closed and names exactly what is missing.
      - name: Check Linux GPU runner toolchain
        run: bash tests/ci/linux_gpu_runner.sh check-tools

      # Must precede the build and every GPU step: it decides whether anything
      # measured afterwards is a measurement of the renderer (#875).
      # #875 -- unrelated GPU work landing on the box while CI runs turns
      # wall-clock budgets into failures that read like renderer regressions
      # (#867, #881). This waits for the GPU to be free, then leaves a background
      # sampler running so the postflight below can say whether contention began
      # mid-job. It never relaxes a budget: a contended run is void, not passed.
      - name: Preflight - GPU contention, wait for a free runner (#875)
        run: python3 tests/ci/runner_gpu_contention.py preflight

      - name: Preflight - runner GPU environment (#875)
        run: python3 tests/ci/preflight_runner_gpu_environment.py

      # GAP-403: per-job venv from the hash-locked file, never the runner's
      # global interpreter.
      - name: Install SCons
        run: bash tests/ci/linux_gpu_runner.sh venv

      # The binary comes from build-linux-editor, never from a compile here.
      - name: Download binary built for this commit
        uses: actions/download-artifact@v4
        with:
          name: godot-linuxbsd-editor-tests-${{ github.sha }}
          path: ${{ runner.temp }}/godot-build

      - name: Verify and install binary (pinned to github.sha)
        run: bash tests/ci/linux_gpu_runner.sh install-binary "$RUNNER_TEMP/godot-build"

      - name: Resolve Godot binary
        id: godot_bin
        run: |
          resolved=""
          for candidate in \
            bin/godot.linuxbsd.editor.dev.x86_64 \
            bin/godot.linuxbsd.editor.x86_64; do
            if [ -x "$candidate" ]; then
              resolved="$(realpath "$candidate")"
              break
            fi
          done
          if [ -z "$resolved" ]; then
            echo "::error::Could not find built Godot binary in expected bin/ paths."
            ls -la bin || true
            exit 1
          fi
          echo "Resolved Godot binary: $resolved"
          echo "path=$resolved" >> "$GITHUB_OUTPUT"

      # #790: this step used to omit --godot-binary, so it regenerated the
      # lightweight Python-fallback corpus -- test_splats.ply at 1024 splats
      # against a declared floor of 10000 -- and every benchmark lane below then
      # failed preflight into a continue-on-error step. The binary resolved above
      # is the tests=yes build that carries the C++ [GeneratePLY] generators; it
      # was already in scope and simply was not handed over. The prep script now
      # fails rather than substituting the small fixtures, so this step going red
      # means the generators are broken, not that the fixtures are small.
      - name: Prepare canonical synthetic assets
        id: prepare_synthetic_assets
        env:
          GODOT_BINARY: ${{ steps.godot_bin.outputs.path }}
        run: |
          python tests/runtime/prepare_synthetic_assets.py --quiet --godot-binary "$GODOT_BINARY"

      # #790: `continue-on-error: true` used to sit on this step. The fixture
      # floor guard in run_benchmark.py preflight is fail-closed and was failing
      # exactly as designed -- exit 2, no numbers produced -- and this line made a
      # working guard invisible. It is gone. The JOB still carries
      # continue-on-error (this evidence surface is non-blocking by design), so a
      # failure here shows as a red job with a named cause instead of a green one
      # that measured nothing.
      # #1045: this step is the ONLY thing in the repository that runs
      # `open_world_corridor_proof`, the lane that actually drives a chunked
      # GaussianSplatWorld3D, and until now it was reachable only from a
      # workflow_dispatch with an opt-in input. Every workflow_dispatch run of this
      # workflow is from March 2026, so the lane had never executed -- inside a job
      # named "Open-World Proof Evidence" that runs weekly. `schedule` is added here
      # so the scheduled run exercises the surface the job is named after. The
      # `if` deliberately mirrors the weekly step below rather than inventing a
      # third trigger shape.
      - name: Run openworld-proof-dev evidence surface
        id: openworld_proof_dev
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_openworld_proof_dev == true) }}
        env:
          GODOT_BINARY: ${{ steps.godot_bin.outputs.path }}
        run: |
          python tests/runtime/run_benchmark.py \
            --godot-binary "$GODOT_BINARY" \
            --project-path tests/examples/godot/test_project \
            --profile performance \
            --lane open_world_corridor_proof \
            --lane city_flyover \
            --require-asset-variant cpp_rich \
            --no-dashboard \
            --output-dir "$PWD/tests/output/benchmark_evidence/openworld-proof-dev"

      - name: Summarize openworld-proof-dev evidence
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_openworld_proof_dev == true)) }}
        env:
          SURFACE_OUTCOME: ${{ steps.openworld_proof_dev.outcome }}
        run: |
          surface_name="openworld-proof-dev"
          summary_path="tests/output/benchmark_evidence/openworld-proof-dev/benchmark_suite_summary.md"
          # #1045: three outcomes must not share an encoding. This job carries
          # continue-on-error, so a failure here never reaches the RUN conclusion --
          # the 2026-09-21 nightly failed and `gh run list` showed green. Until the
          # blocking question on #1045 is decided, the least this surface can do is
          # say which of the three states it is in, in words, at the top.
          case "$SURFACE_OUTCOME" in
            success)   verdict="RAN AND PASSED" ;;
            failure)   verdict="RAN AND FAILED - this is NOT 'nothing to report'" ;;
            cancelled) verdict="CANCELLED - no evidence was produced" ;;
            skipped)   verdict="DID NOT RUN - no evidence was produced, and that is not a pass" ;;
            *)         verdict="UNKNOWN OUTCOME '$SURFACE_OUTCOME' - treat as no evidence" ;;
          esac
          {
            echo ""
            echo "## $surface_name (non-blocking evidence)"
            echo ""
            echo "- **Status: $verdict** (raw outcome: \`$SURFACE_OUTCOME\`)"
            echo "- Lane under test: \`open_world_corridor_proof\` (the only lane that drives a chunked GaussianSplatWorld3D)"
            echo ""
            if [ -f "$summary_path" ]; then
              cat "$summary_path"
            else
              # #790: "not produced" was the only thing this surface ever said, and
              # it read as "nothing to report" rather than "the fixture contract
              # refused to publish numbers". Name the outcome, and where to look.
              echo "- **No benchmark summary was produced.** The run above ended \`$SURFACE_OUTCOME\`; if it failed, the benchmark-suite preflight refused to publish numbers (missing, undersized or unrecognized fixture) - read that step's log for the per-lane reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload openworld-proof-dev evidence artifact
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_openworld_proof_dev == true)) }}
        uses: actions/upload-artifact@v4
        with:
          name: openworld-proof-dev-evidence
          path: repo/tests/output/benchmark_evidence/openworld-proof-dev
          if-no-files-found: warn

      # A dispatch can request both surfaces, and the schedule runs both. This step
      # must not depend on anything the dev surface did -- its benchmark, summary or
      # artifact upload -- so it is gated on its real prerequisites only: the
      # fixture prep step succeeded. That step itself runs only when every earlier
      # step (checkout, build, binary resolution) succeeded, so a failed build or a
      # failed fixture prep still skips this step rather than running a benchmark
      # against a binary that does not exist. `success()` is deliberately NOT used:
      # it also goes false when a dev-surface summary or upload step fails, which
      # silently skipped the weekly surface (Codex review on #1046). `!cancelled()`
      # keeps a cancelled run from starting it.
      - name: Run openworld-proof-weekly evidence surface
        id: openworld_proof_weekly
        if: ${{ !cancelled() && steps.prepare_synthetic_assets.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_openworld_proof_weekly == true)) }}
        env:
          GODOT_BINARY: ${{ steps.godot_bin.outputs.path }}
        run: |
          python tests/runtime/run_benchmark.py \
            --godot-binary "$GODOT_BINARY" \
            --project-path tests/examples/godot/test_project \
            --profile performance \
            --lane long_soak \
            --require-asset-variant cpp_rich \
            --no-dashboard \
            --output-dir "$PWD/tests/output/benchmark_evidence/openworld-proof-weekly"

      - name: Summarize openworld-proof-weekly evidence
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_openworld_proof_weekly == true)) }}
        env:
          SURFACE_OUTCOME: ${{ steps.openworld_proof_weekly.outcome }}
        run: |
          surface_name="openworld-proof-weekly"
          summary_path="tests/output/benchmark_evidence/openworld-proof-weekly/benchmark_suite_summary.md"
          {
            echo ""
            echo "## $surface_name (non-blocking evidence)"
            echo ""
            echo "- Benchmark run outcome: \`$SURFACE_OUTCOME\`"
            echo ""
            if [ -f "$summary_path" ]; then
              cat "$summary_path"
            else
              echo "- **No benchmark summary was produced.** The run above ended \`$SURFACE_OUTCOME\`; if it failed, the benchmark-suite preflight refused to publish numbers (missing, undersized or unrecognized fixture) - read that step's log for the per-lane reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload openworld-proof-weekly evidence artifact
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_openworld_proof_weekly == true)) }}
        uses: actions/upload-artifact@v4
        with:
          name: openworld-proof-weekly-evidence
          path: repo/tests/output/benchmark_evidence/openworld-proof-weekly
          if-no-files-found: warn
      # #875 -- must run even when the job failed: a timing failure above is
      # exactly the result whose attribution this decides. Exits 75 (not 1) when
      # the run is void, so it cannot be read as a test failure.
      - name: Postflight - GPU contention verdict (#875)
        if: always()
        run: python3 tests/ci/runner_gpu_contention.py postflight
