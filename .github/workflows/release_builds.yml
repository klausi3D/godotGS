name: Release Builds

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "*.py"
      - "SConstruct"
      - ".github/workflows/release_builds.yml"
      # Helper scripts this workflow EXECUTES. `*.py` above is root-level only
      # (a single `*` does not span `/`), so without these a change to one of
      # them would skip the very lanes that run it. Deliberately not
      # `tests/ci/**`: that would fire two editor builds plus two template
      # builds on unrelated guard edits. The list is kept honest by
      # tests/ci/test_release_builds_path_filters.py, which derives the set of
      # executed scripts from this file and fails if one is not listed here --
      # so a new helper cannot silently reopen the gap (#825).
      - "tests/ci/resolve_export_template.py"
      - "tests/ci/check_renderer_release_gates.py"
      - "tests/ci/release_attestation.py"
  push:
    branches: [master, main, develop]
    tags:
      - "v*"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "*.py"
      - "SConstruct"
      - ".github/workflows/release_builds.yml"
      # Keep in sync with the pull_request filter above; same reasoning.
      - "tests/ci/resolve_export_template.py"
      - "tests/ci/check_renderer_release_gates.py"
      - "tests/ci/release_attestation.py"
  schedule:
    # Nightly preview build at 02:30 UTC.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      publish_channel:
        description: "Release channel for manual runs"
        required: false
        default: none
        type: choice
        options:
          - none
          - nightly
          - stable
      release_tag:
        description: "Tag used for manual stable publish (required when publish_channel=stable)"
        required: false
        type: string
      release_name:
        description: "Optional custom release name for manual publish"
        required: false
        type: string
      keep_nightlies:
        description: "Nightly prereleases to keep when pruning (manual nightly only)"
        required: false
        default: "14"
        type: string

# #649: least privilege. The workflow-default token is read-only; the release-capable
# `contents: write` scope is granted per job (publish_release, prune_nightly_history)
# only, so every build/test job that checks out and executes repository code runs with
# a read-only token.
permissions:
  contents: read
  actions: read

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release_metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      keep_nightlies: ${{ steps.meta.outputs.keep_nightlies }}
    steps:
      - name: Resolve channel metadata
        id: meta
        env:
          INPUT_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_channel || 'none' }}
          INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          INPUT_RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || '' }}
          INPUT_KEEP_NIGHTLIES: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_nightlies || '14' }}
        run: |
          set -euo pipefail

          channel="ci"
          publish="false"
          prerelease="false"
          tag=""
          release_name=""
          keep_nightlies="${INPUT_KEEP_NIGHTLIES:-14}"

          if ! [[ "$keep_nightlies" =~ ^[0-9]+$ ]]; then
            keep_nightlies="14"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel="stable"
            publish="true"
            prerelease="false"
            tag="${GITHUB_REF#refs/tags/}"
            release_name="GodotGS ${tag}"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            channel="nightly"
            publish="true"
            prerelease="true"
            date_utc="$(date -u +%Y%m%d)"
            tag="nightly-${date_utc}"
            release_name="GodotGS Nightly ${date_utc}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${INPUT_CHANNEL}" in
              nightly)
                channel="nightly"
                publish="true"
                prerelease="true"
                date_utc="$(date -u +%Y%m%d)"
                tag="nightly-${date_utc}"
                release_name="GodotGS Nightly ${date_utc}"
                ;;
              stable)
                if [[ -z "${INPUT_RELEASE_TAG}" ]]; then
                  echo "Manual stable publish requires release_tag input."
                  exit 1
                fi
                channel="stable"
                publish="true"
                prerelease="false"
                tag="${INPUT_RELEASE_TAG}"
                release_name="GodotGS ${tag}"
                ;;
              *)
                channel="ci"
                publish="false"
                prerelease="false"
                ;;
            esac
          fi

          if [[ -n "${INPUT_RELEASE_NAME}" && "${publish}" == "true" ]]; then
            release_name="${INPUT_RELEASE_NAME}"
          fi

          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "keep_nightlies=${keep_nightlies}" >> "$GITHUB_OUTPUT"

  build_linux:
    name: Build Linux Editor + Contributor Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: release_metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Restore SCons build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .scons_cache
          key: release-scons-linux-${{ hashFiles('SConstruct', 'methods.py') }}-${{ github.sha }}
          restore-keys: |
            release-scons-linux-${{ hashFiles('SConstruct', 'methods.py') }}-
            release-scons-linux-

      - name: Build module-enabled Linux editor
        run: |
          set -euo pipefail
          # gs_avx2=no is PINNED, not left to `auto` (#671). GS_AVX2_ENABLED has
          # ZERO C++ readers, so there is no runtime dispatch and no fallback:
          # gs_avx2=yes is an unconditional ISA floor whose failure mode on an
          # older CPU is an illegal-instruction fault inside GS code, not a
          # diagnostic. Upstream Godot declines AVX2 for the same reason
          # (SConstruct:736-740) and ships SSE4.2. `auto` declines today, so this
          # is a NO-OP -- pinned so a future change to `auto` cannot silently
          # raise the CPU floor of an artifact a user downloads.
          if [[ "${{ needs.release_metadata.outputs.channel }}" == "stable" ]]; then
            scons platform=linuxbsd target=editor gs_avx2=no cache_path=.scons_cache cache_limit=10 -j"$(nproc)"
          else
            scons platform=linuxbsd target=editor dev_build=yes tests=yes gs_avx2=no cache_path=.scons_cache cache_limit=10 -j"$(nproc)"
          fi

      - name: Resolve built binary
        id: binary
        run: |
          set -euo pipefail
          godot_bin="$(find bin -maxdepth 1 -type f -executable -name 'godot*linuxbsd*editor*' | sort | head -n 1)"
          if [[ -z "${godot_bin}" ]]; then
            echo "Could not locate built Linux editor binary in bin/"
            ls -la bin || true
            exit 1
          fi
          echo "path=${godot_bin}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${godot_bin}")" >> "$GITHUB_OUTPUT"

      - name: Package artifacts + checksums
        id: package
        run: |
          set -euo pipefail

          mkdir -p dist

          binary_path="${{ steps.binary.outputs.path }}"
          binary_name="${{ steps.binary.outputs.name }}"
          cp "${binary_path}" "dist/${binary_name}"

          version_label="${{ needs.release_metadata.outputs.tag }}"
          if [[ -z "${version_label}" ]]; then
            version_label="${GITHUB_SHA:0:12}"
          fi

          archive_base="godotgs-linux-x86_64-${version_label}"
          archive_path="dist/${archive_base}.tar.xz"
          checksum_path="dist/${archive_base}.sha256"

          tar -C dist -cJf "${archive_path}" "${binary_name}"
          sha256sum "${archive_path}" > "${checksum_path}"

          cat > dist/BUILD-INFO.txt <<EOF
          channel=${{ needs.release_metadata.outputs.channel }}
          publish=${{ needs.release_metadata.outputs.publish }}
          tag=${{ needs.release_metadata.outputs.tag }}
          commit=${GITHUB_SHA}
          binary=${binary_name}
          generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          echo "archive=${archive_path}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum_path}" >> "$GITHUB_OUTPUT"

      - name: Upload contributor artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godotgs-linux-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            dist/BUILD-INFO.txt
          retention-days: 14

  build_linux_export_template:
    name: Build Linux Export Template (release)
    # Issue #825: this fork publishes no export templates, so a user who
    # downloads it gets an editor and no way to export a game. This job builds
    # the Linux release template and uploads it as an artifact. It is
    # deliberately NOT wired into `release_candidate_gate` or `publish_release`
    # -- template distribution must not become a dependency of the release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: release_metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Restore SCons build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Separate cache path/prefix from the editor job: template_release and
          # editor objects differ in every flag that matters (TOOLS_ENABLED,
          # NDEBUG, optimize), so sharing one cache would only thrash it.
          path: .scons_cache_template
          key: release-scons-linux-template-${{ hashFiles('SConstruct', 'methods.py') }}-${{ github.sha }}
          restore-keys: |
            release-scons-linux-template-${{ hashFiles('SConstruct', 'methods.py') }}-
            release-scons-linux-template-

      - name: Build Linux export template (release)
        run: |
          set -euo pipefail
          # No `dev_build` and no `tests` here, on any channel. The editor jobs
          # set dev_build=yes on non-stable channels; copying that would publish
          # an -O0 template that nobody can ship a game with.
          scons platform=linuxbsd target=template_release arch=x86_64 gs_native_arch=no \
            cache_path=.scons_cache_template cache_limit=10 -j"$(nproc)"

      - name: Resolve export template binary
        id: template_bin
        run: |
          set -euo pipefail
          # Shared, unit-tested resolver (tests/ci/resolve_export_template.py +
          # test_resolve_export_template.py). It owns both the SConstruct output
          # names and Godot's expected export-template names, so neither job
          # re-derives them inline. Fails closed on missing/ambiguous binaries.
          python3 tests/ci/resolve_export_template.py \
            --bin-dir bin --platform linuxbsd --scons-target template_release --arch x86_64

      - name: Stage export template under Godot's expected file name
        id: package
        run: |
          set -euo pipefail

          template_name="${{ steps.template_bin.outputs.template_name }}"
          built_path="${{ steps.template_bin.outputs.main_path }}"
          built_name="${{ steps.template_bin.outputs.main_name }}"

          mkdir -p dist
          cp "${built_path}" "dist/${template_name}"
          chmod +x "dist/${template_name}"

          version_label="${{ needs.release_metadata.outputs.tag }}"
          if [[ -z "${version_label}" ]]; then
            version_label="${GITHUB_SHA:0:12}"
          fi

          archive_base="godotgs-export-template-linux-x86_64-${version_label}"

          tar -C dist -cJf "dist/${archive_base}.tar.xz" "${template_name}"
          # #632: record the checksum against the BARE archive file name, not
          # "dist/<name>", so `sha256sum -c <file>.sha256` works from the
          # directory the assets are downloaded into. Matches what the Windows
          # job writes.
          ( cd dist && sha256sum "${archive_base}.tar.xz" > "${archive_base}.sha256" )

          cat > dist/EXPORT-TEMPLATE-INFO.txt <<EOF
          channel=${{ needs.release_metadata.outputs.channel }}
          tag=${{ needs.release_metadata.outputs.tag }}
          commit=${GITHUB_SHA}
          target=template_release
          template=${template_name}
          source_binary=${built_name}
          note_scope=Only release templates are published for now; debug templates are a follow-up.
          note_usage=Set custom_template/release in export_presets.cfg or the export silently uses a stock non-GS template.
          generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          echo "archive=dist/${archive_base}.tar.xz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${archive_base}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload export template artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godotgs-export-template-linux-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            dist/EXPORT-TEMPLATE-INFO.txt
          retention-days: 14

  finite_math_guard:
    name: Fast-math Finiteness Guard (Linux optimize=speed)
    # Issue #590: the shipping config (target=template_release resolves
    # optimize=auto -> speed) compiles the whole module with GCC/Clang
    # -ffast-math. No other lane builds optimize=speed, so a regression that
    # re-disables the NaN/Inf import + payload guards would ship silently.
    # This lane builds the module with optimize=speed on GCC (the affected
    # toolchain) and runs the GaussianData finiteness doctest against that
    # binary. target=editor+tests keeps the doctest runner and every module
    # symbol linkable while still triggering the exact SCsub optimize=="speed"
    # flag branch; NDEBUG is defined because dev_build is not set.
    #
    # This lane is a BLOCKING dependency of `publish_release` (see that job's
    # `needs:` and `if:`). A guard that only reports a red X next to a green
    # release is not a guard: without the dependency a failing finiteness check
    # could coexist with a published release carrying exactly the NaN/Inf
    # regression it exists to catch. It gates every publishing channel --
    # nightly included -- because every channel ships the same module code.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Restore SCons build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .scons_cache
          key: finite-math-scons-linux-${{ hashFiles('SConstruct', 'methods.py') }}-${{ github.sha }}
          restore-keys: |
            finite-math-scons-linux-${{ hashFiles('SConstruct', 'methods.py') }}-
            finite-math-scons-linux-

      - name: Build module editor with optimize=speed (fast-math path)
        run: |
          set -euo pipefail
          # gs_avx2=no here is NOT about publishing -- this lane ships nothing.
          # It is pinned so the finite-math guard exercises the same ISA as the
          # artifacts we publish; a guard that compiles a different instruction
          # set than the shipping build is not evidence about the shipping build.
          scons platform=linuxbsd target=editor tests=yes optimize=speed \
            gs_native_arch=no gs_avx2=no cache_path=.scons_cache cache_limit=10 -j"$(nproc)"

      - name: Resolve built binary
        id: binary
        run: |
          set -euo pipefail
          godot_bin="$(find bin -maxdepth 1 -type f -executable -name 'godot*linuxbsd*editor*' | sort | head -n 1)"
          if [[ -z "${godot_bin}" ]]; then
            echo "Could not locate built Linux editor binary in bin/"
            ls -la bin || true
            exit 1
          fi
          echo "path=${godot_bin}" >> "$GITHUB_OUTPUT"

      - name: Run finiteness doctest against the fast-math build
        run: |
          set -uo pipefail
          bin="${{ steps.binary.outputs.path }}"
          # doctest returns 0 even when the filter matches ZERO cases, so we
          # must both check the exit code AND prove the case actually ran.
          out="$("${bin}" --headless --test \
            "--test-case=*GPU payload validation rejects non-finite*" 2>&1)"
          rc=$?
          echo "${out}"
          if [[ ${rc} -ne 0 ]]; then
            echo "::error::Finiteness doctest exited ${rc} — NaN/Inf guards likely folded under -ffast-math (issue #590)."
            exit 1
          fi
          if ! echo "${out}" | grep -Eq 'test cases:[[:space:]]*[1-9]'; then
            echo "::error::No finiteness test case matched the filter; cannot confirm the guard ran."
            exit 1
          fi
          if echo "${out}" | grep -Eq '[1-9][0-9]* failed'; then
            echo "::error::Finiteness doctest reported failures under optimize=speed (issue #590)."
            exit 1
          fi
          echo "Finiteness guard verified under GCC optimize=speed (fast-math)."

  build_windows:
    name: Build Windows Editor + Contributor Artifact
    runs-on: [self-hosted, Windows, X64, godotgs]
    needs: release_metadata
    # Never run self-hosted Windows job on untrusted PR code. PR artifact
    # validation is handled by the Linux job on GitHub-hosted runners.
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Configure Git safe.directory for self-hosted workspace
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          fetch-depth: 0
          submodules: recursive
          set-safe-directory: false

      - name: Verify Python on runner
        shell: pwsh
        run: |
          python --version

      - name: Set up MSVC build env
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons

      - name: Build module-enabled Windows editor
        shell: pwsh
        run: |
          $args = @(
            "platform=windows",
            "target=editor",
            "gs_native_arch=no",
            # gs_avx2=no pinned on every published artifact -- see #671 and the
            # comment on the Linux editor build above.
            "gs_avx2=no",
            "cache_path=C:/godotgs-scons-cache",
            "cache_limit=50",
            "-j12"
          )
          if ("${{ needs.release_metadata.outputs.channel }}" -ne "stable") {
            $args += "dev_build=yes"
            $args += "tests=yes"
          }
          python -m SCons @args

      - name: Resolve Godot binaries
        id: godot_bin
        shell: pwsh
        run: |
          # Godot's Windows build emits a pair: the main GUI editor exe and a
          # small *.console.exe launcher that re-spawns the main exe with stdout
          # attached. Both must ship in the release zip. Without the main exe
          # (~230 MB), the launcher (~160 KB) cannot find its sibling and the
          # download is unusable.
          $allExes = @(Get-ChildItem -Path "bin" -Filter "godot.windows.editor*.x86_64.exe" -File -ErrorAction SilentlyContinue)
          $mainExes = @($allExes | Where-Object { $_.Name -notlike "*.console.exe" })
          $consoleExes = @($allExes | Where-Object { $_.Name -like "*.console.exe" })

          # A clean build (the runner does `git clean -ffdx` before invoking
          # scons) produces exactly one main exe and at most one console
          # wrapper per channel. Fail fast if the glob matches more than one
          # main exe — it means bin\ has stale artifacts from a previous
          # build with a different flavor, and silently picking one variant
          # is what caused the original broken-zip bug this commit fixes.
          if ($mainExes.Count -eq 0) {
            Write-Host "bin\ contents:"
            Get-ChildItem -Path "bin" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
            throw "Could not find main Godot editor exe in bin\ (looked for godot.windows.editor*.x86_64.exe excluding .console.exe)."
          }
          if ($mainExes.Count -gt 1) {
            Write-Host "bin\ contents:"
            Get-ChildItem -Path "bin" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
            $mainNames = ($mainExes | ForEach-Object { $_.Name }) -join ", "
            throw "Ambiguous main editor in bin\ — expected exactly one match for 'godot.windows.editor*.x86_64.exe' (excluding .console.exe), found $($mainExes.Count): $mainNames. Clean bin\ before rebuilding."
          }
          if ($consoleExes.Count -gt 1) {
            Write-Host "bin\ contents:"
            Get-ChildItem -Path "bin" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
            $consoleNames = ($consoleExes | ForEach-Object { $_.Name }) -join ", "
            throw "Ambiguous console wrapper in bin\ — expected at most one '*.console.exe', found $($consoleExes.Count): $consoleNames. Clean bin\ before rebuilding."
          }

          $main = $mainExes[0]
          Write-Host "Resolved main editor: $($main.FullName) ($([math]::Round($main.Length / 1MB, 1)) MB)"
          "main_path=$($main.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "main_name=$($main.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($consoleExes.Count -eq 1) {
            $console = $consoleExes[0]
            Write-Host "Resolved console wrapper: $($console.FullName) ($([math]::Round($console.Length / 1KB, 1)) KB)"
            "console_path=$($console.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "console_name=$($console.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "No .console.exe wrapper found; shipping main editor only."
          }

      - name: Package artifacts + checksums
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $mainPath = "${{ steps.godot_bin.outputs.main_path }}"
          $mainName = "${{ steps.godot_bin.outputs.main_name }}"
          Copy-Item -LiteralPath $mainPath -Destination (Join-Path "dist" $mainName) -Force

          $consolePath = "${{ steps.godot_bin.outputs.console_path }}"
          $consoleName = "${{ steps.godot_bin.outputs.console_name }}"
          $hasConsole = -not [string]::IsNullOrWhiteSpace($consolePath)
          if ($hasConsole) {
            Copy-Item -LiteralPath $consolePath -Destination (Join-Path "dist" $consoleName) -Force
          }

          $versionLabel = "${{ needs.release_metadata.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($versionLabel)) {
            $versionLabel = "${{ github.sha }}".Substring(0, 12)
          }

          $distPath = (Resolve-Path "dist").Path
          $archiveBase = "godotgs-windows-x86_64-$versionLabel"
          $archiveName = "$archiveBase.zip"
          $archivePath = Join-Path $distPath $archiveName
          $checksumPath = Join-Path $distPath "$archiveBase.sha256"
          $archiveRelative = "dist/$archiveName"
          $checksumRelative = "dist/$archiveBase.sha256"
          $buildInfoPath = Join-Path $distPath "BUILD-INFO.txt"

          $buildInfoLines = @(
            "channel=${{ needs.release_metadata.outputs.channel }}"
            "publish=${{ needs.release_metadata.outputs.publish }}"
            "tag=${{ needs.release_metadata.outputs.tag }}"
            "commit=${{ github.sha }}"
            "binary=$mainName"
          )
          if ($hasConsole) {
            $buildInfoLines += "console_binary=$consoleName"
          }
          $buildInfoLines += "generated_at_utc=$(Get-Date -AsUTC -Format o)"
          $buildInfoLines | Set-Content -Path $buildInfoPath -Encoding utf8

          $filesToCompress = @($mainName, "BUILD-INFO.txt")
          if ($hasConsole) {
            $filesToCompress = @($mainName, $consoleName, "BUILD-INFO.txt")
          }

          Push-Location $distPath
          try {
            Compress-Archive -Path $filesToCompress -DestinationPath $archivePath -Force
          } finally {
            Pop-Location
          }

          $archiveSizeMB = [math]::Round((Get-Item $archivePath).Length / 1MB, 1)
          Write-Host "Built archive $archiveName ($archiveSizeMB MB) containing: $($filesToCompress -join ', ')"

          $hash = Get-FileHash -Algorithm SHA256 -Path $archivePath
          "{0}  {1}" -f $hash.Hash.ToLower(), $archiveName | Out-File -FilePath $checksumPath -Encoding ascii

          "archive=$archiveRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$checksumRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload contributor artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godotgs-windows-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: |
            repo/${{ steps.package.outputs.archive }}
            repo/${{ steps.package.outputs.checksum }}
          retention-days: 14

  build_windows_export_template:
    name: Build Windows Export Template (release)
    # Issue #825: companion to build_linux_export_template. Uploads the Windows
    # release template as an artifact only -- deliberately NOT a dependency of
    # `release_candidate_gate` or `publish_release`.
    runs-on: [self-hosted, Windows, X64, godotgs]
    needs: release_metadata
    # Never run a self-hosted Windows job on untrusted PR code. This is the
    # STRICTER of the two accepted forms (see .github/workflows/README.md,
    # "Runner Trust Boundary"): it skips every pull request, not just fork ones,
    # matching `build_windows` above. Narrower than the repository-standard fork
    # guard, never wider. The cost -- Windows-only packaging is not exercised by
    # a PR -- is stated and bounded in that README bullet, and the whole
    # arrangement is enforced by tests/ci/test_release_builds_runner_trust.py,
    # which fails if a self-hosted job here is undocumented or unguarded.
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Configure Git safe.directory for self-hosted workspace
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          fetch-depth: 0
          submodules: recursive
          set-safe-directory: false

      - name: Verify Python on runner
        shell: pwsh
        run: |
          python --version

      - name: Set up MSVC build env
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons

      - name: Build Windows export template (release)
        shell: pwsh
        run: |
          # No `dev_build` and no `tests` on any channel -- an export template
          # must ship optimized. `cache_path` is deliberately distinct from the
          # editor job's C:/godotgs-scons-cache so template and editor objects
          # do not thrash a shared cache.
          $args = @(
            "platform=windows",
            "target=template_release",
            "arch=x86_64",
            "gs_native_arch=no",
            "cache_path=C:/godotgs-scons-cache-template",
            "cache_limit=50",
            "-j12"
          )
          python -m SCons @args

      - name: Resolve export template binaries
        id: template_bin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Shared, unit-tested resolver (tests/ci/resolve_export_template.py +
          # test_resolve_export_template.py). It owns both the SConstruct output
          # names and Godot's expected export-template names.
          #
          # This step used to glob inline with
          # `godot.windows.template_release*.x86_64.exe` and then require one
          # `*.console.exe` among the matches. SConstruct appends `.console`
          # AFTER the architecture, so the wrapper is
          # `godot.windows.template_release.x86_64.console.exe` and never
          # matched -- the count check threw on every run and no artifact was
          # ever uploaded. The resolver's predicates are disjoint by
          # construction and are tested against those exact file names.
          python tests/ci/resolve_export_template.py --bin-dir bin --platform windows --scons-target template_release --arch x86_64
          if ($LASTEXITCODE -ne 0) {
            Write-Host "bin\ contents:"
            Get-ChildItem -Path "bin" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
            throw "Could not resolve the Windows export template binaries in bin\."
          }

      - name: Stage export template under Godot's expected file names
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $templateName = "${{ steps.template_bin.outputs.template_name }}"
          $consoleTemplateName = "${{ steps.template_bin.outputs.console_template_name }}"
          Copy-Item -LiteralPath "${{ steps.template_bin.outputs.main_path }}" -Destination (Join-Path "dist" $templateName) -Force
          Copy-Item -LiteralPath "${{ steps.template_bin.outputs.console_path }}" -Destination (Join-Path "dist" $consoleTemplateName) -Force

          $versionLabel = "${{ needs.release_metadata.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($versionLabel)) {
            $versionLabel = "${{ github.sha }}".Substring(0, 12)
          }

          $distPath = (Resolve-Path "dist").Path
          $archiveBase = "godotgs-export-template-windows-x86_64-$versionLabel"
          $archiveName = "$archiveBase.zip"
          $archivePath = Join-Path $distPath $archiveName
          $checksumPath = Join-Path $distPath "$archiveBase.sha256"
          $infoPath = Join-Path $distPath "EXPORT-TEMPLATE-INFO.txt"

          @(
            "channel=${{ needs.release_metadata.outputs.channel }}"
            "tag=${{ needs.release_metadata.outputs.tag }}"
            "commit=${{ github.sha }}"
            "target=template_release"
            "template=$templateName"
            "console_template=$consoleTemplateName"
            "source_binary=${{ steps.template_bin.outputs.main_name }}"
            "note_scope=Only release templates are published for now; debug templates are a follow-up."
            "note_usage=Set custom_template/release in export_presets.cfg or the export silently uses a stock non-GS template."
            "generated_at_utc=$(Get-Date -AsUTC -Format o)"
          ) | Set-Content -Path $infoPath -Encoding utf8

          Push-Location $distPath
          try {
            Compress-Archive -Path @($templateName, $consoleTemplateName) -DestinationPath $archivePath -Force
          } finally {
            Pop-Location
          }

          $archiveSizeMB = [math]::Round((Get-Item $archivePath).Length / 1MB, 1)
          Write-Host "Built archive $archiveName ($archiveSizeMB MB) containing: $templateName, $consoleTemplateName"

          $hash = Get-FileHash -Algorithm SHA256 -Path $archivePath
          "{0}  {1}" -f $hash.Hash.ToLower(), $archiveName | Out-File -FilePath $checksumPath -Encoding ascii

          "archive=dist/$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=dist/$archiveBase.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "info=dist/EXPORT-TEMPLATE-INFO.txt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload export template artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godotgs-export-template-windows-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: |
            repo/${{ steps.package.outputs.archive }}
            repo/${{ steps.package.outputs.checksum }}
            repo/${{ steps.package.outputs.info }}
          retention-days: 14

  release_candidate_gate:
    name: Release candidate gate
    runs-on: ubuntu-latest
    needs:
      - release_metadata
      - build_linux
      - build_windows
      - finite_math_guard
    # Runs whenever a publish is requested so `publish_release` can hard-depend
    # on this job's success (fail-closed wiring for #593). This job is the single
    # authority for "is a stable/candidate release allowed to publish":
    #
    #   * Stable/candidate channel (a `v*` tag push or a manual stable dispatch):
    #     REQUIRES both platform builds AND a passing
    #     `check_renderer_release_gates.py --mode candidate` run against a
    #     public-alpha evidence bundle. If the evidence bundle is absent, the gate
    #     FAILS (fail-closed) and the release cannot publish.
    #   * Nightly prereleases: pass-through. The public-alpha candidate contract
    #     (docs/reference/renderer_release_gate_manifest.json) governs only the
    #     stable/candidate release path; nightly prereleases keep the Linux-only
    #     tolerance below.
    #
    # INTEGRATION (#612 + #620 union): the fast-math finiteness guard (#590) is
    # part of THIS gate's dependency graph, not a sibling of it. Because this job
    # runs under `always()`, a `needs:` entry alone blocks nothing -- the result
    # must be asserted explicitly, exactly as `publish_release` does for this
    # job. `finite_math_guard` gates EVERY publishing channel (nightly included)
    # because every channel ships the same module code; a binary whose NaN/Inf
    # guards were folded away by -ffast-math is precisely what that lane exists
    # to stop. Asserting it here means a failed guard makes this gate `skipped`,
    # which in turn fails `publish_release`'s `result == 'success'` check.
    if: |
      always() &&
      needs.release_metadata.outputs.publish == 'true' &&
      needs.finite_math_guard.result == 'success'
    env:
      # Repo-relative path to the public-alpha candidate evidence bundle and its
      # issue snapshot. These are produced by the public-alpha evidence pipeline
      # tracked by issue #360 (candidate GPU-harness report, benchmark-lane
      # report, artifact SHA/commit-parity, issue snapshot). That pipeline is NOT
      # yet wired into CI, so on a real `v*` tag these files are absent and the
      # gate fails closed. A maintainer cutting a candidate points
      # RELEASE_CANDIDATE_EVIDENCE at a produced bundle via a repo/environment
      # variable. TODO(#360/#593): generate this bundle in-workflow so a green
      # stable tag is self-proving instead of relying on an out-of-band bundle.
      RELEASE_CANDIDATE_EVIDENCE: ${{ vars.RELEASE_CANDIDATE_EVIDENCE || 'release-candidate-evidence/candidate_evidence.json' }}
      RELEASE_CANDIDATE_ISSUES: ${{ vars.RELEASE_CANDIDATE_ISSUES || 'release-candidate-evidence/issue_snapshot.json' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Require both platform builds for a stable release
        if: needs.release_metadata.outputs.channel == 'stable'
        run: |
          set -euo pipefail
          ok=1
          if [[ "${{ needs.build_linux.result }}" != "success" ]]; then
            echo "::error::Linux build result is '${{ needs.build_linux.result }}'; a stable release must ship both platforms."
            ok=0
          fi
          if [[ "${{ needs.build_windows.result }}" != "success" ]]; then
            echo "::error::Windows build result is '${{ needs.build_windows.result }}'; a stable release must ship both platforms (no Linux-only stable publish, #593)."
            ok=0
          fi
          if [[ "$ok" != "1" ]]; then
            exit 1
          fi
          echo "Both platform builds succeeded."

      # Everything below binds the release decision to the *bytes this run built*.
      # The candidate bundle alone is only internally consistent; it must also be
      # shown to describe this commit and these archives, and the archives the
      # gate blessed must be the archives publish_release uploads.
      - name: Download Linux release payload built by this run
        if: needs.build_linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godotgs-linux-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: release-payload/linux

      - name: Download Windows release payload built by this run
        if: needs.build_windows.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godotgs-windows-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: release-payload/windows

      - name: Hash release payload and bind it to this commit
        id: built
        if: needs.build_linux.result == 'success'
        run: |
          set -euo pipefail

          # Exactly one match or fail: an ambiguous glob means the payload carries
          # an archive we did not intend to ship.
          resolve_one() {
            local dir="$1" pattern="$2"
            local -a found=()
            mapfile -t found < <(find "${dir}" -maxdepth 1 -type f -name "${pattern}" | sort)
            if [[ "${#found[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one '${pattern}' in ${dir}; found ${#found[@]}: ${found[*]-none}" >&2
              return 1
            fi
            printf '%s\n' "${found[0]}"
          }

          # The published .sha256 sidecar must describe the archive we ship.
          # Compare digest fields rather than running `sha256sum -c`: the Linux
          # sidecar records the build-time path (dist/...), which does not exist
          # in the downloaded payload, so -c would fail on a correct archive.
          check_sidecar() {
            local archive="$1" sidecar="$2"
            local recorded actual
            recorded="$(awk 'NR==1{print tolower($1)}' "${sidecar}")"
            actual="$(sha256sum "${archive}" | cut -d' ' -f1)"
            if [[ "${recorded}" != "${actual}" ]]; then
              echo "::error::Checksum sidecar ${sidecar} records ${recorded} but ${archive} hashes to ${actual}." >&2
              return 1
            fi
            printf '%s\n' "${actual}"
          }

          linux_archive="$(resolve_one release-payload/linux 'godotgs-linux-x86_64-*.tar.xz')"
          linux_sidecar="$(resolve_one release-payload/linux 'godotgs-linux-x86_64-*.sha256')"
          echo "Linux archive: ${linux_archive}"

          # BUILD-INFO.txt is generated by build_linux from GITHUB_SHA. Requiring
          # the recorded commit to equal the commit being published rejects a
          # payload produced for any other commit -- including on the nightly
          # channel, which has no candidate evidence bundle at all.
          build_info="release-payload/linux/BUILD-INFO.txt"
          if [[ ! -f "${build_info}" ]]; then
            echo "::error::Linux payload has no BUILD-INFO.txt; cannot bind it to a commit."
            exit 1
          fi
          recorded_commit="$(sed -n 's/^commit=//p' "${build_info}" | head -n 1)"
          if [[ "${recorded_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Linux payload BUILD-INFO commit '${recorded_commit}' != commit being published '${GITHUB_SHA}'."
            exit 1
          fi

          linux_sha="$(check_sidecar "${linux_archive}" "${linux_sidecar}")"
          echo "linux_sha=${linux_sha}" >> "$GITHUB_OUTPUT"
          echo "Linux archive sha256=${linux_sha}"

          windows_sha=""
          if [[ -d release-payload/windows ]]; then
            windows_archive="$(resolve_one release-payload/windows 'godotgs-windows-x86_64-*.zip')"
            windows_sidecar="$(resolve_one release-payload/windows 'godotgs-windows-x86_64-*.sha256')"
            windows_sha="$(check_sidecar "${windows_archive}" "${windows_sidecar}")"
            echo "Windows archive: ${windows_archive} sha256=${windows_sha}"
          fi
          echo "windows_sha=${windows_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate release candidate (public-alpha gate)
        if: needs.release_metadata.outputs.channel == 'stable'
        run: |
          set -euo pipefail
          evidence="${RELEASE_CANDIDATE_EVIDENCE}"
          issues="${RELEASE_CANDIDATE_ISSUES}"
          echo "Resolving release-candidate evidence bundle: ${evidence}"
          if [[ ! -f "${evidence}" ]]; then
            echo "::error::Release-candidate evidence bundle not found at '${evidence}'."
            echo "::error::A stable/tag publish is gated on 'check_renderer_release_gates.py --mode candidate' (#593)."
            echo "::error::Produce the public-alpha evidence bundle (issue #360) and set the RELEASE_CANDIDATE_EVIDENCE repo/environment variable, or do not push a v* tag."
            exit 1
          fi
          if [[ ! -f "${issues}" ]]; then
            echo "::error::Independent release-candidate issue snapshot not found at '${issues}'."
            echo "::error::A snapshot embedded in the candidate evidence bundle cannot certify its own blocker set."
            exit 1
          fi
          args=(--mode candidate --candidate-evidence "${evidence}" --issues-json "${issues}")

          # Supply-chain binding (#593 review): the bundle must be FOR this commit
          # and must record the digests of the archives this run actually built.
          # Without these two flags a stale but internally consistent bundle --
          # one whose own artifact digests match its own recorded commit -- would
          # authorize publishing binaries it never validated.
          args+=(--expected-commit "${GITHUB_SHA}")
          linux_sha="${{ steps.built.outputs.linux_sha }}"
          windows_sha="${{ steps.built.outputs.windows_sha }}"
          if [[ -z "${linux_sha}" ]]; then
            echo "::error::No Linux archive digest was computed; refusing to validate a candidate against unknown bytes."
            exit 1
          fi
          args+=(--artifact-sha "linux_release_archive=${linux_sha}")
          if [[ -z "${windows_sha}" ]]; then
            # The both-platform step above already failed the stable path in this
            # case; belt-and-braces so the binding can never be silently partial.
            echo "::error::No Windows archive digest was computed; a stable release must bind both platforms."
            exit 1
          fi
          args+=(--artifact-sha "windows_release_archive=${windows_sha}")

          echo "Running: python tests/ci/check_renderer_release_gates.py ${args[*]}"
          python tests/ci/check_renderer_release_gates.py "${args[@]}"

      - name: Non-stable channel (candidate gate not required)
        if: needs.release_metadata.outputs.channel != 'stable'
        run: |
          echo "Channel '${{ needs.release_metadata.outputs.channel }}' is a prerelease; the public-alpha candidate gate governs only the stable/tag release path. Skipping candidate validation."
          echo "The commit binding and release attestation still apply to this channel."

      - name: Attest the exact bytes this gate validated
        if: needs.build_linux.result == 'success'
        run: |
          set -euo pipefail
          python tests/ci/release_attestation.py generate \
            --root release-payload \
            --commit "${GITHUB_SHA}" \
            --tag "${{ needs.release_metadata.outputs.tag }}" \
            --channel "${{ needs.release_metadata.outputs.channel }}" \
            --output release-attestation/release-attestation.json

      - name: Upload release attestation
        if: needs.build_linux.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godotgs-release-attestation-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: release-attestation/release-attestation.json
          retention-days: 14
          if-no-files-found: error

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # #649: the release-capable write token is scoped to this job only.
    permissions:
      contents: write
    needs:
      - release_metadata
      - build_linux
      - build_windows
      - finite_math_guard
      - release_candidate_gate
    # A stable release cannot publish unless `release_candidate_gate` succeeded:
    # that gate enforces both-platform builds AND `--mode candidate` validation
    # for the stable/tag path, and fails closed when the evidence bundle is
    # absent (#593). Nightly prereleases still tolerate a Linux-only publish (a
    # Windows runner outage must not block the nightly cadence): the gate is a
    # pass-through for nightly, the Windows artifact is downloaded optionally
    # below, and `fail_on_unmatched_files` is relaxed for the nightly channel.
    #
    # The fast-math finiteness guard (#590) is NOT optional either: this job
    # uses `always()`, so listing a job under `needs:` alone does not block
    # anything -- the result must be asserted explicitly. Requiring
    # `finite_math_guard.result == 'success'` is what makes the guard a real
    # release gate rather than a decorative red X. It applies to every
    # publishing channel because every channel ships the same module code, and
    # a shipped binary whose NaN/Inf guards were folded away by -ffast-math is
    # exactly the failure this lane exists to prevent.
    #
    # INTEGRATION (#612 + #620 union): the guard is asserted BOTH here and in
    # `release_candidate_gate` (which also runs under `always()`). The gate-side
    # assertion puts the guard inside the publication dependency graph; this
    # direct assertion is the belt-and-braces edge, so the guard still blocks
    # even if the gate's own conditions are later relaxed. Neither side was
    # dropped.
    if: |
      always() &&
      needs.release_metadata.outputs.publish == 'true' &&
      needs.build_linux.result == 'success' &&
      needs.finite_math_guard.result == 'success' &&
      needs.release_candidate_gate.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          path: repo

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download Linux contributor artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godotgs-linux-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: release-assets/linux

      - name: Download Windows contributor artifact
        if: needs.build_windows.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godotgs-windows-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: release-assets/windows

      - name: Download release attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godotgs-release-attestation-${{ needs.release_metadata.outputs.channel }}-${{ github.run_number }}
          path: release-attestation

      # Fail-closed link between "what release_candidate_gate validated" and
      # "what we are about to upload". The gate hashed the payload it blessed;
      # here we re-hash the payload we downloaded and require an exact match on
      # every file plus on the commit. Any divergence -- a re-run that rebuilt an
      # artifact, an artifact replaced under a colliding name, an extra file
      # slipped into the payload -- stops the publish instead of shipping bytes
      # nobody validated (#593 supply-chain binding).
      - name: Verify shipped bytes against the release attestation
        env:
          TAG: ${{ needs.release_metadata.outputs.tag }}
          WINDOWS_OK: ${{ needs.build_windows.result == 'success' }}
        run: |
          set -euo pipefail
          args=(
            verify
            --root release-assets
            --commit "${GITHUB_SHA}"
            --attestation release-attestation/release-attestation.json
            --require "linux/godotgs-linux-x86_64-${TAG}.tar.xz"
            --require "linux/godotgs-linux-x86_64-${TAG}.sha256"
            --require "linux/BUILD-INFO.txt"
          )
          if [[ "${WINDOWS_OK}" == "true" ]]; then
            args+=(--require "windows/godotgs-windows-x86_64-${TAG}.zip")
            args+=(--require "windows/godotgs-windows-x86_64-${TAG}.sha256")
          fi
          python repo/tests/ci/release_attestation.py "${args[@]}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release_metadata.outputs.tag }}
          name: ${{ needs.release_metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.release_metadata.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          # Stable releases must not silently ship a partial asset set: if any
          # listed file is missing the publish fails (#593). The stable path is
          # guaranteed both-platform by release_candidate_gate, so every file
          # below exists. Nightly prereleases keep the relaxed behavior because
          # they tolerate a Linux-only publish.
          fail_on_unmatched_files: ${{ needs.release_metadata.outputs.channel == 'stable' }}
          files: |
            release-assets/linux/godotgs-linux-x86_64-${{ needs.release_metadata.outputs.tag }}.tar.xz
            release-assets/linux/godotgs-linux-x86_64-${{ needs.release_metadata.outputs.tag }}.sha256
            release-assets/linux/BUILD-INFO.txt
            release-assets/windows/godotgs-windows-x86_64-${{ needs.release_metadata.outputs.tag }}.zip
            release-assets/windows/godotgs-windows-x86_64-${{ needs.release_metadata.outputs.tag }}.sha256
          overwrite_files: true

  prune_nightly_history:
    name: Prune old nightly prereleases
    runs-on: ubuntu-latest
    # #649: deleting stale nightly releases/tags needs the write token; scope it here.
    permissions:
      contents: write
    needs:
      - release_metadata
      - publish_release
    if: needs.release_metadata.outputs.channel == 'nightly' && needs.release_metadata.outputs.publish == 'true'
    steps:
      - name: Delete old nightly releases/tags
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const keepCount = Number('${{ needs.release_metadata.outputs.keep_nightlies }}' || '14');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const nightlies = releases
              .filter((release) => release.tag_name && release.tag_name.startsWith('nightly-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const stale = nightlies.slice(Math.max(keepCount, 0));
            core.info(`Nightly releases found: ${nightlies.length}. Keeping: ${keepCount}. Pruning: ${stale.length}.`);

            for (const release of stale) {
              core.info(`Deleting release ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`,
                });
                core.info(`Deleted tag ${release.tag_name}`);
              } catch (error) {
                core.warning(`Failed to delete tag ${release.tag_name}: ${error.message}`);
              }
            }
